name: Recuperar keystore (temporal)

# Workflow TEMPORAL, de un solo uso: reconstruye el keystore de firma desde el
# secret KEYSTORE_BASE64 (la unica copia que quedaba de la clave), lo cifra con
# AES256 usando KEYSTORE_RECOVERY_PASS y lo publica como artifact para bajarlo
# a la torre. El .jks en claro nunca sale del runner ni aparece en los logs.
#
# BORRAR este archivo, el artifact y el secret KEYSTORE_RECOVERY_PASS en cuanto
# la clave este a salvo en local.
on:
  workflow_dispatch:

permissions:
  contents: read

# Las actions JS corren en Node 24 (Node 20 quedo deprecado).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Reconstruir y cifrar el keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          RECOVERY_PASS: ${{ secrets.KEYSTORE_RECOVERY_PASS }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore.jks
          # Huella del archivo para confirmar en local que llego intacto.
          # Se guarda en el artifact, no se imprime en el log.
          sha256sum keystore.jks | cut -d' ' -f1 > keystore.sha256
          printf '%s' "$RECOVERY_PASS" | gpg --batch --yes --symmetric \
            --cipher-algo AES256 --passphrase-fd 0 \
            -o keystore.jks.gpg keystore.jks
          rm -f keystore.jks
          ls -l keystore.jks.gpg

      - name: Publicar el blob cifrado
        uses: actions/upload-artifact@v4
        with:
          name: keystore-cifrado
          path: |
            keystore.jks.gpg
            keystore.sha256
          retention-days: 1
