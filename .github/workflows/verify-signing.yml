name: Verificar firma (temporal)

# Workflow TEMPORAL: repite exactamente los pasos de firma de "Release APK"
# (decodificar KEYSTORE_BASE64, escribir keystore.properties desde los secrets,
# assembleRelease) para comprobar que los secrets rotados el 2026-09-07 siguen
# produciendo un APK firmado con EL MISMO certificado de siempre.
#
# NO publica release, NO crea tags y NO sube artifacts. Borrar cuando pase.
on:
  workflow_dispatch:

permissions:
  contents: read

# Las actions JS corren en Node 24 (Node 20 quedo deprecado).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  # Huella del certificado que ha firmado todas las releases. Si cambia, las
  # instalaciones existentes ya no se pueden actualizar.
  EXPECTED_SHA256: '9686b4581c2c62db1c6c398c11dcc71da6d4341f9c5cbf8c5c7dea5a707b4195'

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release.jks

      - name: Create keystore.properties
        run: |
          cat > keystore.properties <<EOF
          storeFile=release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Use runner JDK (drop hardcoded org.gradle.java.home)
        run: sed -i '/^org\.gradle\.java\.home=/d' gradle.properties

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Comprobar el certificado de firma
        run: |
          set -eo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK: $SDK"
          APKSIGNER=$(find "$SDK" -name apksigner -type f 2>/dev/null | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "No se encontro apksigner bajo $SDK"; exit 1
          fi
          echo "apksigner: $APKSIGNER"
          "$APKSIGNER" verify --print-certs \
            app/build/outputs/apk/release/app-release.apk > certs.txt
          cat certs.txt
          # apksigner <=35 imprime "Signer #1 certificate ..."; el 37 imprime
          # "V2 Signer: certificate ...". Sirven los dos.
          GOT=$(grep -m1 'certificate SHA-256 digest:' certs.txt | awk '{print $NF}')
          echo "esperado: $EXPECTED_SHA256"
          echo "obtenido: $GOT"
          if [ "$GOT" = "$EXPECTED_SHA256" ]; then
            echo "OK: el APK se firmo con la clave correcta."
          else
            echo "FALLO: el certificado NO coincide."
            exit 1
          fi
